name: Build installable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build the personal-use APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Give the APK a useful name
        run: cp app/build/outputs/apk/debug/app-debug.apk Locate-Cardboard-Widget.apk

      - name: Save the APK
        uses: actions/upload-artifact@v7
        with:
          name: locate-cardboard-android-apk
          path: Locate-Cardboard-Widget.apk
          if-no-files-found: error
          retention-days: 7
